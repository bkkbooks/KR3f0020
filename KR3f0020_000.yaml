body:
  text: 欽定四庫全書御製儀象考成序上古占天之事詳於虞典書稱在璿璣玉衡以齊七政後世渾天諸儀所為權輿也厯代以來遞推迭究益就精密所傳六合三辰四逰儀之制本朝初年猶用之我皇祖聖祖仁皇帝奉若天道研極理數嘗用監臣南懷仁言改造六儀輯靈臺儀象志所司奉以測驗其用法簡當如定周天度數為三百六十周日刻數為九十有六分黃赤道以備儀制減地平環以清儀象創制精密尤有非前代所及者顧星辰循黃道行每七十年差一度黃赤二道之相距亦數十年差一分所當隨時釐訂以期吻合而六儀之改創也占候雖精體制究未協於古赤道一儀又無遊環以應合天度志載星象亦間有漏略躐次者我皇祖精眀步天定時之道使用六儀度至今必早有以隨時更正矣豫小子法祖敬天雖切於衷而推測協紀之方實未夙習兹因監臣之請按六儀新法參渾儀舊式製為璣衡撫辰儀繪圖著説以禆測候并考天官家諸星紀數之闕者補之序之紊者正之勒為一書名曰儀象考成縱豫斯之未信期允當之可循由是儀器正天象著而推算之法大備夫制器尚象以前民用莫不當求其至精至密矧其為授時所本熙績所關尤不容有秒忽差者折衷損益彰往察來以要諸盡善奉時修紀之道敢弗慎諸至乃基命宥密所為夙夜孜孜監于成憲者又自有在是為序乾隆二十有一年嵗在丙子冬十有一月御筆欽天監監正加禮部侍郎臣戴進賢等謹奏為請旨增修靈臺儀象志表以昭遵守事竊臣等西鄙庸愚荷蒙我皇上深仁廣覆畀以璣衡重任早夜兢兢唯恐有曠職守伏查康熙十三年蒙聖祖仁皇帝命原任治理歷法兼工部侍郎臣南懷仁製造觀象臺測量日月星辰儀器六座又纂成靈臺儀象志一書有解有圖有表皆闡明儀器六座所用之法此書乃臣監中天文科推測星象所常用者其中詮解用法儀詳理備但志中原載星辰循黃道行每年約差五十一秒合七十年則差一度今為時已久運度與表不符理宜改定再查康熙十三年纂修儀象志時黃道赤道相距二十三度三十二分今測得相距二十三度二十九分志中所列諸表皆據曩時分度所當逐一加修吻合天行庶測驗時更覺便於較證又查三垣二十八宿以及諸星今昔多寡不同應以本年甲子為元釐輯增訂以資考測臣等受恩日久報稱無能此乃分所應辦故敢冒昧陳奏至修書人員容臣於監中揀用數員務期悉心從事書成之日進呈御覽恭請欽定伏候睿鑒施行謹奏乾隆九年十月初六日具奏奉旨著莊親王鄂爾泰張照議奏欽此和碩莊親王臣允祿等謹奏十月初六日發下戴進賢等奏摺一件奉旨著莊親王鄂爾泰張照議奏欽此該臣等議得戴進賢等摺請修靈臺儀象志一書係伊衙門應辦之事又即請用伊衙門所有之人不支桌飯銀兩自應如所請令其精詳修纂完竣進呈御覽伏候聖訓謹奏乾隆九年十一月初六日具奏奉旨依議仍著莊親王鄂爾泰張照兼管欽此和碩莊親王臣允祿等謹奏為請旨事乾隆九年十一月二十二日臣等奏稱三辰公晷儀制規倣璣衡其用廣大簡易為從前所未有請製造大儀安置觀象臺上以便測量之用如蒙俞允臣等會同海望三和辦理等因奉旨好依議欽此本月二十六日奉旨觀象臺所存舊儀座架廢銅著即為製造新儀之用欽此該臣等會看得觀象臺現設黃道赤道二儀俱徑六尺座髙四尺五寸今應按其尺度製造謹用五分之一擬製式樣恭呈御覽伏候聖訓再鑄造儀器若另立作厰置辦器具未免糜費錢糧今郎中佛保現在雍和宫辦理鑄造之事請就便交與佛保處遵旨用舊儀座架廢銅鑄造如有不敷再行配搭添補臣等已𣲖出內務府郎中楊作新公義副總領葉文成臣館算學教習何國棟原任欽天監五官正劉裕錫會同監製督工臣等不時前往查看一切作法仍會同西洋人戴進賢劉松齡等商酌辨理其需用工料錢糧數目令佛保等細加核估臣等另行奏聞為此謹奏請旨乾隆十年三月三十日具奏奉旨好照議辦理先依此五分之一式樣製造銅儀一座進呈欽此和碩莊親王臣允祿等謹奏為奏聞事乾隆十年三月三十日臣等奏稱觀象臺現設黃道赤道二儀俱徑六尺座髙四尺五寸今鑄造三辰儀應按其尺度製造謹用五分之一擬製式樣恭呈御覽請交與佛保處遵旨用舊儀座架廢銅鑄造其需用工料錢糧數目令佛保等細加核估臣等另行奏聞等因奉旨好照議辦理先依此五分之一式樣製造銅儀一座進呈欽此欽遵臣等隨令郎中佛保等將五分之一銅儀一座現今敬謹製造外其觀象臺添設三辰儀據該郎中佛保等約估得鑄造三辰儀并運往安設等項辦買物料計銀八百四十八兩三錢四分六釐食糧匠役一萬三千三百三十工每工飯銀三分六釐計銀四百七十九兩八錢八分外雇匠役一萬八千八百二十六工每工銀一錢五分四釐計銀二千八百九十九兩二錢四釐壯夫七百十四名每名銀八分計銀五十七兩一錢六分以上辦買物料匠役工價飯銀共約需銀四千二百八十四兩五錢九分相應向廣儲司領取應用如有餘剩核明繳回倘不敷用再行請領統俟工完之日核實報銷謹將約估需用工料錢糧細數并行取物料另繕清單一併恭呈御覽伏候聖訓謹此奏聞乾隆十年七月十七日具奏奉旨知道了欽此和碩莊親王臣允祿等謹奏為遵旨增修靈臺儀象志恆星經緯度表告成恭呈御覽仰祈聖鑒事乾隆九年十一月內欽天監監正戴進賢等奏請增修靈臺儀象志一摺臣允祿等遵旨議覆係伊衙門應辦之事應如所請令其精詳修纂完竣進呈等因奉旨依議仍著莊親王鄂爾泰張照兼管欽此臣等謹查漢以前星官名數今無全書晉志載吳太史令陳卓總巫咸甘石三家星官著於圖録凡二百八十三官一千四百六十四星今亦不見原本隋丹元子步天歌與陳卓數合後之言星官者皆以步天歌為凖康熙十三年監臣南懷仁修儀象志星名與古同者總二百六十一官一千二百一十星比步天歌少二十二官二百五十四星又於有名常數之外增五百一十六星又多近南極星二十三官一百五十星監臣戴進賢等據西洋新測星度纍加測驗儀象志尚多未合又星之次第多不順序臣何國宗恭奉聖訓宜加釐正臣劉松齡臣鮑友管率同監員明安圖等詳加測算著之於圖臣允祿等復公同考定總計星名與古同者二百七十七官一千三百一十九星比舊儀象志多十六官一百零九星與步天歌為近其中次第顛倒凌躐臣等順序改正者一百五官四百四十五星其尤彰明較著者二十八宿次舍自古皆觜宿在前參宿在後其以何星作距星史無明文儀象志以參宿中三星之西一星作距星則觜宿在後參宿在前今依次順序以參宿中三星之東一星作距星則觜前參後與古合亦經順序改正又於有名常數之外增一千六百一十四星按其次序分注方位以備稽考又近南極星二十三官一百五十星中國所不見悉仍西測之舊共計恆星三百官三千零八十三星編為總紀一卷黃道經緯度表赤道經緯度表各十二卷月五星相距恆星經緯度表一卷天漢黃赤經緯度表四卷共成書三十卷書內星圖體制微小謹另繪大圖一併恭呈御覽伏乞皇上訓定欽賜嘉名御製序文冠於卷端交武英殿刋刻以垂永久所有襄事諸臣職名應否載入另摺開列請旨為此謹奏乾隆十七年十一月二十二日具奏奉旨知道了書名用儀象考成職名準開載新測恆星並增星圖象著照乾清宫陳設天球式樣製造二分進呈欽此和碩莊親王臣允祿等謹奏為請旨更定時憲書觜參之序以歸畫一事查時憲書內鋪注二十八宿值日古法觜宿在前參宿在後自用西法以來改為參宿在前觜宿在後乾隆五年欽天監修協紀辦方書奏稱星宿值日於算法疏密全無關涉請依古改正經大學士九卿議覆二十八宿值日載在時憲書既於算法全無關涉則亦不必更改等因在案今臣等奉命重修儀象志恆星經緯度表查明星座次第順序改正參宿在後觜宿在前列於恆星經緯度表恭候欽定則乾隆十九年之七政書即用此表推算若時憲書之值宿仍依參前觜後鋪注則與七政書不能畫一請以乾隆十九年為始依古觜前參後改正鋪注則七政書之星度時憲書之日宿皆一例順序矣臣等未敢擅便伏乞皇上聖鑒敕下大學士九卿再行議覆施行為此謹奏請旨又夾片謹查二十八宿星次或自下而上如角室等宿或自東而西如虛畢等宿或自西而東如心尾等宿或自中而左右旋轉如斗牛等宿而以第一星作距星則各宿皆同惟觜參二宿相近自古星躔分野皆觜宿在前參宿在後西法以參宿中三星之西一星作距星則參宿在前觜宿在後今以參宿中三星之東一星作距星則觜前參後與古合再查二十八宿分列四方每方各七宿星家分配七政皆木金土日月火水為序東方七宿角亢氐房心尾箕屬火箕屬水北方七宿斗牛女虛危室壁室屬火壁屬水南方七宿井鬼柳星張翼軫翼屬火軫屬水皆係火前水後惟西方七宿若以奎婁胃昴畢參觜為序參屬水觜屬火則水前火後與三方之序不協今改觜前參後則火前水後與三方之序吻合乾隆十七年十一月二十四日具奏奉旨大學士會同九卿議奏欽此大學士忠勇公臣傅恆等謹題為遵旨議奏事乾隆十七年十一月二十六日內閣抄出和碩莊親王等具奏內開查時憲書內鋪注二十八宿值日古法觜宿在前參宿在後自用西法以來改為參宿在前觜宿在後乾隆五年欽天監修協紀辨方書奏稱星宿值日與算法疏密全無關涉請依古改正經大學士九卿議覆二十八宿值日載在時憲書既於算法全無關涉則亦不必更改等因在案今臣等奉命重修儀象志恆星經緯度表查明星座次第順序改正參宿在後觜宿在前列於恆星經緯度表恭候欽定則乾隆十九年之七政書即用此表推算若時憲書之值宿仍依參前觜後鋪注則與七政書不能畫一請以乾隆十九年為始依古觜前參後改正鋪注則七政書之星度時憲書之值宿皆一例順序矣伏乞皇上聖鑒敕下大學士九卿再行議覆施行謹奏請旨又夾片內開謹查二十八宿星次或自下而上如角室等宿或自東而西如虛畢等宿或自西而東如心尾等宿或自中而左右旋轉如斗牛等宿而以第一星作距星則各宿皆同惟觜參二宿相近自古星躔分野皆觜宿在前參宿在後西法以參宿中三星之西一星作距星則參宿在前觜宿在後今以參宿中三星之東一星作距星則觜前參後與古合再查二十八宿分列四方每方各七宿星家分配七政皆木金土日月火水為序東方七宿角亢氐房心尾箕尾屬火箕屬水北方七宿斗牛女虛危室壁室屬火壁屬水南方七宿井鬼柳星張翼軫翼屬火軫屬水皆係火前水後惟西方七宿若以奎婁胃昴畢參觜為序參屬水觜屬火則水前火後與三方之序不協今改觜前參後則火前水後與三方之序吻合等因具奏奉旨大學士會同九卿議奏欽此欽遵抄出到部該臣等會議得周天躔度以二十八宿為經星經星之星數多寡不一所占之度數亦廣狹不一而前後相次總以各宿之第一星為距星此天象之自然古今所不易也其間惟觜參二宿相距最近觜止三星形如品字其所占之度狹參有七星三星平列於中四星角出於外其所占之度廣古法以參宿中三星之東一星作距星則觜前參後康熙年間用西法算書以參中三星之西一星作距星遂改為參前觜後故時憲書內星宿值日亦依此序鋪注乾隆五年欽天監修協紀辨方書曾奏稱宿之距星惟人所指星宿值日於算法疏密全無關礙請依古改正當經大學士九卿奉旨議覆以星宿值日既於算法全無關礙則既經康熙年間改定今亦不必更改等因在案惟是宿之距星惟人所指而以星度考之觜之占度本狹古以觜在前則距參一度而分野之度狹參之占度本廣古以參在後則距井十度三十六分而分野之度廣若如西法以參在前以觜在後是則參反距觜一度而參宿距井之十度三十六分移而歸觜似不如古法為優今莊親王等既奏稱奉命重修儀象志恆星經緯度表查明星座次第順序改正參宿在後觜宿在前列於恆星經緯度表乾隆十九年之七政書即用此表推算並時憲書之值宿亦依古觜前參後改正鋪注等語是觜參之前後現今依古改正至時憲書之值宿雖與七政書算法全無關礙而七政書乃時憲書之所從出其鋪注列宿次第未便與推算之星度互異應如所奏請以乾隆十九年為始時憲書之值宿依古改正仍以觜前參後鋪注觜參之前後既經順序改正與恆星經緯度表相合則二十八宿分列四方星家以七宿分配七政皆木金土日月火水為序者西方七宿亦火前水後與三方之序吻合矣恭候命下之日令欽天監遵照辦理可也再此本係禮部主稿合并聲明臣等未敢擅便謹題請旨乾隆十七年十二月十四日題本月十六日奉旨依議欽此和碩莊親王臣允祿等謹奏為請旨事乾隆九年十一月內臣等摺奏三辰公晷儀制規倣璣衡其用廣大簡易為從前所未有請製造大儀安置觀象臺上以便測候之用如蒙俞允臣等會同海望三和辦理等因奉旨好依議欽此欽遵今已製造安設訖臣等謹按尚書蔡沈注云宋錢樂作渾天儀即璿璣玉衡遺法本朝因之為儀三重其在外者曰六合儀次其內曰三辰儀其最在內者曰四遊儀臣等從前製造三辰公晷規倣其制省為兩重要帶赤道以其一器而備日月星辰之用故名三辰今製造大儀臣等先經進呈式樣已即仍為三重惟省黃道地平二環以免遮蔽實即璣衡遺法而更為簡明若僅名三辰於義未備伏請皇上欽賜嘉名并請於儀之正中子午雙環南面鐫刻乾隆甲子年御製清漢字樣以垂永久伏祈聖訓為此謹奏請旨乾隆十九年正月初五日具奏奉旨知道了硃筆批出璣衡撫辰儀欽此和碩莊親王臣允祿等謹奏為銷算奏聞事先經臣等奏稱觀象臺添設三辰儀據原任郎中佛保等約估得鑄造併運往安設等項辦買物料需銀八百四十八兩三錢四分六釐匠役等工價飯食需銀三千四百三十六兩二錢四分四釐以上共需銀四千二百八十四兩五錢九分向廣儲司領取應用如有餘剩核明繳回倘不敷用再行請領統俟工完之日核實報銷等因具奏奉旨知道了欽此欽遵在案今製造得三辰儀子午圈二個天常赤道圈一個遊旋赤道圈一個過極圈二個四遊圈二個大龍牙二根小龍牙四根龍柱二根獅子八個雲墩一個地平一件山子四個螺螄四個直距窺管三根業經運往觀象臺合對安設訖查鑄造三辰儀共實用過銅一萬四千零二十四斤五兩此內除觀象臺舊有廢銅六千二百二十斤外添用過鑄爐處銅七千八百零四斤五兩辦買物料及匠役工價飯食共實用過銀三千五百六十九兩八錢四分六釐餘剩銀七百十四兩七錢四分四釐謹將用過銅斤辦買物料銀兩及行取過物料數目另繕清單一併恭呈御覽俟命下之日交各該處查照外餘剩銀兩繳回廣儲司可也為此謹具奏聞乾隆十九年正月初五日具奏奉旨知道了欽此刑部左侍郎鑲紅旗滿洲副都統兼管欽天監事務臣覺離勒爾森工部左侍郎樂部大臣裏行兼管欽天監事務臣何國宗謹奏為御製儀器告成恭疏陳謝并請編著儀説以垂永久事乾隆九年十月二十七日皇上駕幸觀象臺特允莊親王等所請規放璣衡製造大儀安設臺上以裨測候乾隆十九年正月初五日賜名御製璣衡撫辰儀三月十六日鐫刻清漢文訖欽惟一皇上道通法象學貫天人欽若授時齊七政而萬邦惟憲文明熙載撫五辰而庶績其凝固已嫓美勳華合符化育矣乃以靈臺舊器赤道動靜未分前代渾儀天度竒零不盡爰稽古制聿闡新規兩極兼三逺紹唐虞遺法七環省二祕參易簡真源誠千古之巨觀萬年之大寶也臣等瞻天仰聖無任屏營抑臣等更有請者儀器法理精微功用廣大康熙十三年新製六儀告成臣監請修儀象志十六卷星度之外儀説附之乾隆九年臣監監正戴進賢等因星度尚有未合奏請重修蒙皇上敕交莊親王管理乾隆十七年十一月書成三十卷賜名欽定儀象考成武英殿刋刻將次竣事今御製璣衡撫辰儀告成伏請仍敕莊親王率同臣監編著儀説附成全帙宣付史館以傳永久則理明法備球圖共煥光華象顯義彰奕祀永為典則矣為此恭疏陳謝具奏請旨乾隆十九年三月三十日具奏奉旨知道了著交莊親王欽此和碩莊親王臣允祿等謹奏為遵旨編著儀説恭呈御覽仰祈聖訓事乾隆十九年三月三十日臣勒爾森臣何國宗等具奏御製儀器告成恭疏陳謝并請編著儀説以垂永久一摺奉旨知道了著交莊親王欽此欽遵臣等伏惟唐虞之世首重璣衡漢唐以來代有制作我朝康熙八年聖祖仁皇帝命監臣南懷仁新製六儀康熙五十二年命監臣紀利安製地平經緯儀精義利用於斯大備我皇上敬天法祖齊政勤民酌古凖今御製璣衡撫辰儀頒設靈臺用禆測候功用廣大法理精微臣等欽遵聖訓編著儀説首儀制次製法次用法次算法成書上下二卷並從前具奏所奉諭旨敘於卷端謹繕稿本恭呈御覽伏請皇上訓定交武英殿刋刻冠於欽定儀象考成之首所有前後監造諸臣職名另摺開列應否載入伏候諭旨遵行為此謹奏請旨乾隆十九年閏四月二十九日具奏奉旨著刋刻欽此乾隆十七年十一月二十二日奉旨開載