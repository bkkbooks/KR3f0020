  text: 欽定四庫全書欽定儀象考成卷首上御製璣衡撫辰儀說卷上
  hash: sha256:b0ae25c3960a4c2e2a6201b8a5c81c8c37479623d7bb89db28924212c88ab996
  markers:
  - {type: page-break, offset: 0, content: '', id: KR3f0020_WYG_001-1a, image: WYG0793/WYG0793-0023a.png}
body:
  text: 儀制製法御製璣衡撫辰儀說卷上之一儀制全儀子午圈天常赤道赤極經圈遊旋赤道四遊圈指時度表借弧指時度表指緯度表立表平行立表平行借弧表綰經度表綰時度表平行線測經度表虞書舜典在璿璣玉衡以齊七政孔穎逹疏曰璣衡者王者正天文之器漢世以來謂之渾天儀者是也馬融云渾天儀可旋轉故曰璣衡其橫簫所以視星宿也蔡雍云衡長八尺孔徑一寸下端望之以視星辰蓋懸璣以象天而衡望之轉璣窺衡以知星宿是其說也上天之體不可得知測天之事見於經者惟此璿璣玉衡一事而已楊子法言云或問渾天曰落下閎營之鮮于妄人度之耿中丞象之幾乎幾乎莫之能違也閎與妄人武帝時人宣帝時司農中丞耿夀昌始鑄銅為之象史官施用焉江南宋元嘉年太史丞錢樂陳氏師凱曰錢樂本名樂之孔疏脫之字鑄銅作渾天儀傳於齊梁周平江陵遷於長安尚書蔡注曰宋錢樂鑄銅作渾天儀衡長八尺孔徑一寸璣徑八尺圓周二丈五尺强轉而望之以知日月星辰之所在即璿璣玉衡之遺法也厯代以來其法漸密本朝因之為儀三重其在外者曰六合儀平置黑單環上刻十二辰八干四隅在地之位以凖地面而定四方側立黑雙環背刻去極度數以中分天脊直跨地平使其半入地下而結於其子午以為天經斜倚赤單環背刻赤道度數以平分天腹橫繞天經亦使半出地上半入地下而結於其卯酉以為天緯三環表裏相結不動其天經之環則南北二極皆為圓軸虛中而內向以挈三辰四遊之環以其上下四方於是可考故曰六合次其內曰三辰儀側立黑雙環亦刻去極度數外貫天經之軸內挈黃赤二道其赤道則為赤單環外依天緯亦刻宿度而結於黑雙環之卯酉其黃道則為黃單環亦刻宿度而又斜倚於赤道之腹以交結於卯酉而半入其內以為春分後之日軌半出其外以為秋分後之日軌又為白單環以承其交使不傾墊以其日月星辰於是可考故曰三辰其最在內者曰四遊儀亦為黑雙環如三辰儀之制以貫天經之軸其環之內則兩面當中各施直距外指兩軸而當其要中之內面又為小窽以受玉衡要中之小軸使衡既得隨環東西運轉又可隨處南北低昻以待占候者之仰窺焉以其東西南北無不周遍故曰四遊此其法之大略也今考前史漢初落下閎造渾天儀本無黃道或云賈逵所加或云李淳風所加或云一行所加而宋錢樂之渾儀之制雖有黃道並無黃道經圈其四遊圈亦不貫於黃極則亦未盡黃道之用元郭守敬作簡儀乃分渾儀而變其制别設立運圈以測地平經緯度而不設黃道圈蓋黃道與黃極經圈成經緯設黃道又設經圈則圈多而不便於測候故不用黃道而專用赤道圈明正統三年鑄銅渾儀簡儀於北京即宋元遺法也我朝康熙八年聖祖仁皇帝命監臣南懷仁新製六儀赤道黃道分為二器皆不用地平圈而地平象限天體諸儀則地平之經緯與黃赤之錯綜皆已畢具康熙五十二年又命監臣紀利安製地平經緯儀合地平象限二儀而為一其用尤便制作之妙於斯極矣我皇上敬天法祖齊政勤民親蒞靈臺遍觀儀象以渾天制最近古而時度信宜從今觀其㑹通斯成巨典於是用今之數目合古之型模御製璣衡撫辰儀用裨測候誠唐虞之遺意昭代之新規也儀制三重其在外者即古之六合儀而不用地平圈其正立雙環為子午圈兩面皆刻周天三百六十度自南北極起初度至中要九十度是為天經斜倚單環為天常赤道圈兩面皆刻周日十二時以子正午正當子午雙環中空之半而結於其中要是為天緯其南北二極皆設圓軸軸本實於子午雙環中空之間而軸內向以貫內二重之環其下承以雲座仰面正中開雙槽以受雙環東面正中開雲窩以受垂球下面置十字架施螺旋以取平架之東西兩端各植龍柱龍口銜珠開孔以承天常赤道卯酉之兩軸依觀象臺測定南北正線將座架安定則平面之四方正又依京師北極出地三十九度五十五分自北極而上五十度五分即上應天頂自南極而下五十度五分即下對地心而應天頂之衝於天頂施小釘懸垂線而垂適當地心又適切於雙環之面不即不離則上下正立面之四方亦正而地平已在其中故不用地平圈也次其內即古之三辰儀而不用黃道圈其貫於二極之雙環為赤極經圈兩極各設軸孔以受天經之軸兩面皆刻周天三百六十度結於赤極經圈之中要與天常赤道平運者為遊旋赤道圈兩面皆刻周天三百六十度與天之赤道旋轉相應自經圈之南極作兩象限弧以承之使不傾墊測得三辰之赤道經緯度則黃道經緯可推且黃道與赤道之相距古逺今近縱或日久有差而儀器無庸改制故不用黃道圈也其在內者即古之四遊儀貫於二極之雙環為四遊圈兩面皆刻三百六十度定於遊圈之兩極者為直距綰於直距之中心者為窺衡遊圈中要設直表以指經度及時窺衡右旁設直表以指緯度此古今所同無容置議者也是故體制倣乎渾天之舊而時度尤為整齊運量同於赤道新儀而重環更能合應至於借表窺測則上下左右無不宜焉夫羲和遺制不可考已漢世以來或作而不傳或傳而不久蓋制器尚象若斯之難也而稽古宜今至我朝乃臻盡善易繫傳云備物致用立成器以為天下利莫大乎聖人詎不信乎子午圈所以正南北也天之南北定於兩極必先測定南北正線而後安置子午圈則子午圈即為南北之正線南北正而後日軌之髙下時刻之早晚中星之偏度可得而稽也其制雙環外徑六尺三寸內徑五尺六寸六分環面濶三寸二分厚九分中空一寸雙環之間四隅各施銅枕合而固之其中空之半為子午正線兩面各畫三百六十度每度六十分自南北極起初度至中要九十度古曰天經環西法舊曰緯圈蓋織絲以直者為經橫者為緯古以其圈直立故曰經西法以其為橫線所界之度故曰緯今按圈直而度橫則其圈宜曰經圈而其度乃為緯度周禮賈公彥疏所謂南北之道謂之經元儒陳氏師凱所謂自北數向南去如機上數緯絲是也自兩極起初度者北極出地南極入地其度數皆自兩極起算也中要九十度者赤道為帶天之紘距兩極各一象限也南北極各設鋼軸軸本扁方長三寸濶二寸二分厚一寸實於隻環之間以鋼螺旋結之軸長六寸徑八分正當雙環中空之半內向以貫三辰四遊之環所以象天樞也天常赤道所以正時刻也天左旋一日一周南北極持其兩端而赤道為其橫帶以其常定不動故曰天常日循黃道右旋而其隨天西轉則係赤道之度日行臨於赤道之某位即為某時故時刻由赤道而正也其制單環外徑六尺一寸二分內徑五尺六寸四分環面濶二寸四分厚一寸四分平分其厚為赤道之中線兩面各畫周日十二時每時初正各四刻每刻十五分每一時當天之三十度每四刻當天之十五度每一分當天之十五分以其子正午正線當子午雙環中空之半而結於其中要使其赤道中線適當子午圈之九十度兩圈相結成十字直角古曰天緯環西法舊曰赤道經圈蓋古以其圈橫運故曰緯西法以其為直線所界之度故曰經今按圈橫而度直則其圈宜曰緯圈而其度乃為經度周禮賈公彥疏所謂東西之道謂之緯陳氏師凱所謂自東數向西去如機上數經絲是也上面午正時刻線結於子午圈之正北卯正居西酉正居東謂日影對照之時下面則子正居北午正居南卯正居東酉正居西為日行所臨之正位也赤極經圈所以帶赤道也亦曰過極圈制如子午雙環在內而差小外徑五尺五寸六分內徑五尺一寸二分環面濶二寸二分厚八分中空一寸二分兩面皆畫三百六十度每度六十分一面自兩極起初度至赤道九十度以應天經一面自赤道起初度至兩極九十度以應赤緯南北極各設軸孔用扁方銅長三寸濶與環面等厚與雙環中空等中心開圓孔以受天經之軸其孔徑適容軸徑使旋轉不致動搖孔之兩面各施鋼片厚四分使孔徑不致磨損兩軸孔之中徑適當雙環中空之半與兩極徑線參直以鋼螺旋結之環外南北極之兩端各施扁圓鋼子厚五分與內外兩雙環之分縫等貫於天經之軸使赤極經圈之中要九十度線適與子午圈之九十度相凖則內外兩圈上下四方俱合為一線而縱橫經緯自宜悉協矣遊旋赤道所以象天之運行而紀其赤道經度也制如天常赤道在內而差小外徑五尺五寸六分內徑五尺一寸二分環面濶二寸二分厚一寸二分平分其厚為赤道之中線兩面各畫周天三百六十度上面分為十二宫每宫三十度每度六十分下面自丑宫起初度右旋三百六十度以其丑宫未宫初度之線當赤經雙環中空之半而結於其中要使其赤道中線適當經圈之九十度兩圈相結成十字直角與天之赤道旋轉相應又於經圈南極之兩旁設象限弧承於遊旋赤道辰宫戌宫之下以螺旋結之使不傾墊有天常赤道之不動者以定時又有遊旋赤道之常動者以紀度則赤道之逐宫逐度皆能周行於十二時而三辰之所躔與兩曜之相距皆可得而稽矣四遊圈所以測三辰之赤道經緯度也制如赤經雙環在內而差小外徑五尺內徑四尺六寸八分環面濶一寸六分厚七分中空一寸四分蓋三重雙環之外面皆相平而內重則漸薄中空則漸大取其輕重適宜亦便於設窺衡也兩面各畫三百六十度一面自北極起初度至南極一百八十度為去極度一面自赤道起初度至兩極各九十度為距緯度南北極各設軸孔以受夭經之軸與過極圈同環外南北極之兩端各施扁圓鋼子厚六分與赤經四遊兩環之分縫等貫於天經之軸其下半周之中要安直表以指經度及時刻兩面對南北極各安直距如圓之通徑濶一寸六分厚七分中空一寸四分直距之二面對環之兩極作直徑線對環之九十度作橫徑線十字相交中心開圓孔施螺旋小鋼軸而圓其末以綰窺衡窺衡長四尺七寸二分方一寸二分中空一寸上下兩端施方銅蓋厚五分內三分方一寸入於管中外二分方一寸二分齊於管面中心開圓孔上端孔心留十字線以便測視管之四面亦各取中線上面安立表下端右面安指緯度表左右兩面之中心各開圓孔使直距中要小軸之末入其中以綰之則窺衡乃能南北低昂而隨雙環東西運轉焉窺衡連蓋長四尺七寸六分比四遊環內徑長八分兩端各施鋼篐厚一分中要孔外施鋼眼錢亦厚一分使其左右適切於中空之內面上下兩端入於雙環內徑各四分則上下低昂自無偏側而所測經緯度必皆密合矣指時度表通長七寸三分本長一寸六分形如方筒入於四遊雙環中空之間濶一寸四分與四遊環之中空等平分其濶即當窺衡之中線筒中施左右螺旋以充塞於中空之內使表不動移橫帶長三寸二分濶五分兩端各鉤回二分扣於環面之外表長五寸二分濶一寸其指時度之邊線對方筒之正中亦即窺衡之正中下端二寸四分厚三分切於遊旋赤道之面以指度分上端二寸八分厚二分切於天常赤道之面以指時刻也借弧指時度表其本方筒及橫帶長濶並與前指時度表同橫帶之下自左向右立安弧背一道長九寸三分濶一寸二分厚一分六釐弧背之末平安指時度表除弧背之厚長五寸二分濶一寸計自表本方筒之中線至指時度表之內邊長六寸七分當遊旋赤道之十五度當天常赤道之一小時測量時指時度表或為子午圈所礙則用此表視其所指之時度加四刻即為所測之時減十五度即為所測之度蓋借弧指時度表在窺衡之右所指雖視乎借表而所測則定於窺衡天常之時刻左旋故加三辰之度分右旋故減則用借弧指時度表察之與用指時度表等也指緯度表其形兩曲安於窺衡下端之右面底長三寸濶九分平分其濶為中線對衡面中線以螺旋結之曲橫七分與四遊環之厚等又曲長一寸七分切於四遊環之外面從中線減濶之半所以指緯度也立表二座形直底平表髙底長各三寸二分濶九分厚一分平分其濶為中線表直立於底長之半與底面成直角距底面一寸一表向上開長方孔長一寸中留直線又上五分開圓孔徑四分中留十字線安於窺衡之上端一表依前度下開直縫上開小圓孔安於窺衡之下端各對衡面中線以螺旋結之測量時窺衡或為赤道及銅枕所礙則用此表蓋兩表之孔心中線距衡面皆相等又與衡面之中線參直則用立表測之與用窺衡等也平行立表二座形曲底平底盤長四寸濶一寸二分厚一分中空長三寸二分濶九分與立表底盤之長濶等表曲如勾股股直如立表髙三寸二分濶九分勾橫連於股末長五寸濶九分橫植於底盤之末底盤中空冒於立表底盤之外以掐表固之測量時窺衡立表或為子午圈及龍柱所礙則用此表蓋平行立表曲如勾股而與立表平行則用平行立表測之與用立表等亦與用窺衡等也平行借弧表制如平行立表而倒正異蓋四遊窺衡東西為子午圈及龍柱所礙南北為赤道及銅枕所礙則用平行立表猶是窺衡所能及而管孔被遮故其表平行正立即可見若近北極之星則東西既礙於子午圈南北又礙於極軸窺衡不能及自上測之不能及北極之南六度餘自下測之不能及北極之北六度餘故借十度作平行借弧表一表上植一表下垂則窺衡未及北極十度而窺孔之視線已與北極參直其法以半徑一千萬為一率十度之正切線一百七十六萬三千二百七十為二率表之橫勾距窺衡中心二尺三寸三分為三率求得四率四寸一分零八毫為表髙之中數自窺衡中線至直距中線之數上端之表立植於衡面則中數即表髙中數減衡方之半六分加表端距窺孔中心六分為表端至表本之髙仍與中數等下端之表自衡面下垂則於中數加衡方之半六分表端距窺孔中心六分又加平行橫勾之濶九分得六寸二分零八毫為表之髙距表端下六分開圓孔又下五分開長方孔皆與立表制同凡測近北極之星測得距赤道北若干加十度即得星距赤道北之緯度若測赤道南之星亦可用此表但測得距赤道南若干減十度即得星距赤道南之緯度也綰經度表通長四寸濶一寸四分平分其濶即當窺衡之中線其本方筒長一寸六分髙一寸八分入於四遊雙環之間以左右螺旋固之其末上下二面以夾遊旋赤道上面濶七分減本之半與窺衡中線參直下面以螺旋固之所以綰定遊旋赤道之經度於四遊圈也綰時度表內外二截內截上下內三面綰於遊旋赤道之內規上面之末承於外截之下開二方孔以受外截之方足下面以螺旋固之外截上下外三面綰於天常赤道之外規上面之末覆於內截之上安二方足入於內截之方孔下面以螺旋固之凡以太陽時刻及經度測月星則內外截俱綰定别測月星若以經度求時刻則止綰定內截外截隨之運轉視其所當刻分即得時刻若以時刻求經度則止綰定外截任遊旋赤道之運轉視其所當度分即得經度也平行線測經度表以赤經之平行線與直距之平行線相參直赤經之平行線在圓周直距之平行線在圓心其平行線之間俱對南北極之中徑而測距星之經度也其制於直距南北極之兩端各安銅板如工字形正方二寸八分與直距二面之分等直距二面各厚七分中空一寸四分共二寸八分兩要各缺一長方長一寸六分濶七分與直距一面之分等直距二面每面濶一寸六分厚七分扣於直距中空之間中心開圓孔貫於天經之軸四隅距中心一寸九分銅板方二寸八分對角斜線三寸九分八釐四隅距中心各一寸九分九釐今取一寸九分餘九釐各安立柱圓頂開孔以穿直線與直距中徑平行下安小環以為結赤經平行線之用又按距星宫度於遊旋赤道安赤經平行線表其制上畫半圓內容半方自對角斜線起初度至橫徑為四十五度其中直徑與指度表之邊線參直半圓中心安二遊表各長二寸距中心一寸九分邊留小臍中開小圓孔與直距四隅立柱之距中心等以線穿之上端繫於北極銅板對角之兩環下端貫於南極銅板對角之兩環各以垂球墜之乃視四遊圈之所測與此平行線之所測相距若干度即將遊表對半圓度數安定下面以螺旋中徑以壓表固之此二線必與赤經中徑平行而與直距中徑之二平行線廣狹相等從左線視之與所測參直從右線視之亦與所測參直則此二線即為距星經度之凖線以此線對定距星將遊旋赤道隨之運轉又以四遊圈及窺管測日月及星即得其經緯度也蓋以一星作距測日月及星必用兩測舊制黃道赤道二儀南北極之通徑皆係圓軸故測候用通光耳實其正中與軸徑等兩邊各開直縫從左縫對軸左邊見光從右縫對軸右邊見光亦猶用平行線之意也今不用圓軸而用直距兩測相距有逺近則直距對角有斜橫斜則二線平距之分狹橫則二線平距之分廣直巨銅板方分也其對角斜分也二線平距則橫分也對角斜則平距為斜之方故狹對角橫則平距為方之斜故廣其限自正斜起初度至四十五度而橫四十五度以後復由橫而斜至九十度與初度同九十度以後復由斜而橫至一百三十五度與四十五度同一百三十五度以後復由橫而斜至一百八十度與初度同盈半周天而止如四遊環與平行線表同度是為初度是時直距對角正斜而其二線平距之分為斜之方此二線平距之最狹者也過此而四遊環距平行線表漸逺則直距對角漸橫而二線平距漸廣至四遊環距平行線表四十五度則直距對角正橫而其二線平距之分為方之斜此二線平距之最廣者也過此則直距對角又漸斜而二線平距又漸狹至九十度正斜而最狹故又與初度同也今欲使赤經平行線與直距平行線廣狹相等必以直距對角斜橫之度合於赤道之半圓遊表二線距圓心各一寸九分通共三寸八分即直距銅板對角之斜分也半圓自內方之對角斜線起初度即直距對角之初度為正斜也半圓至橫徑為四十五度即直距對角之四十五度為正橫也設以二遊表通為一直表則與直距對角之斜橫儼為一體但遊表在赤道若通為一直表則其線為赤道所礙而廣狹不靈且通為一表此端在橫徑內彼端必在橫徑外凡斜線與十字線過心相交其彼端距橫徑外之度與此端距橫徑內之度必相等而距中徑之濶亦相等故以直表彼端當橫徑外之度另用一遊表於橫徑內按度安之其距中徑之濶必相等而與直距二平行線廣狹亦相等則用平行線表亦猶用通光耳之意也御製璣衡撫辰儀說卷上之二製法銅質宜精型制宜工鏇磨宜平取心宜中輕重宜審界度宜均兩徑合度合結均齊三重同心安置方正銅質宜精凡鑄黃銅器具應用紅銅六成倭鉛四成鎔錬精到然後鑄之遼厯象志云古之鍊銅黑黃白青之氣盡然後用之故可施於久逺唐一行鑄渾天儀時稱精妙理固然也型制宜工凡鑄儀器以土為型必先治地極平外規較定制微大內規較定制微小其外環面如輪次內如輻次內如轂中留環心務極圓平合度則所鑄之體自亦圓平而鏇磨亦易為力矣鏇磨宜平凡製儀器必用鏇磨圓環中心當治方孔以受軸軸圓而方其端施於環心之方孔使環之上下前後左右不得動搖則鏇之自圓且平矣取心宜中凡製圓器必取中心心中則界正未鏇之前環心尚在圓規方孔皆自環心取中逮鏇之既成則無中心矣而畫儀器之圓線則必先取中心為凖須以直木為環徑其兩端即如環之內規切緊安定約其中心嵌定鐵板任於環之內規取三處作㸃用三㸃求圓心法法見數理精藴求得圓心即於鐵板作記次以鋼製規徑一規尖二規尖之本開方孔貫於規徑之兩端一尖安於圓心一尖按環面內外規之度各用螺旋固之於環之內外規旋轉比試處處皆當規面則圓心中矣次依環之內外規取外界圓線半徑之度安定規尖畫外界圓線為度之外界即以此半徑度將外界圓線分為六觚每觚六十度半徑與六十度之通弦等又取內界圓線半徑之度安定規尖畫內界圓線為度之內界自外界每觚六十度之㸃平分之得三十度各對中心作直線抵內界其過心對角之線即圓之通徑而平分環面為兩半周則圓界正矣次將直線輕微引出外界至外規用極方正矩度凖於側面單環則自側面即凖於彼面雙環則自此環之側面凖於彼環之側面復自彼環之側面凖於彼環之彼面輕微畫線作記乃用前直木環徑切緊安定以縱橫二線對於所凖之通徑果於中心相交則所凖確合否則又用前法取心務令得中單環即可如前畫彼面之圓線及十二度線雙環則俟審定輕重合釘枕銅再行比試確凖然後可畫彼面也輕重宜審凡環之兩半周輕重適均則平置無偏側之失運轉無游移之弊審量之法用圓直鐵鋌徑八分與軸徑等長逾環徑平分中線卧置之使不動移而以環面之通徑線加於其上易置試之兩半周無有低昂則輕重適均否則非其線有微差即其體質不等細察磨治務得其輕重之適均則天常赤道之子正午正遊旋赤道之丑宫未宫三雙環之南北極皆以此通徑為凖乃將雙環已畫十二度線之一面置於下以通徑凖線四象分中安設銅枕以雙環彼面之通徑凖線合於上釘而固之復用前法比試確凖取定中心然後畫內外界圓線及十二度線則兩面之圓心圓界允協矣界度宜均環心既中環界既正則界度可得而均矣顧諸環皆取度分惟天常赤道取時刻然時刻亦與度分相凖故取度分者將每觚六十度平分之得三十度又三分之各為十度自外界抵內界各畫直線而於內界之外畫圓線一層是為十度界次將每十度又十分之各為一度自外界抵十度界各畫直線而於十度界之外外界之內各畫圓線一層是為度界次於內度界之外外度界之內各畫圓線一層為十分界將每度六分之各為十分畫直線於其界內次於內外兩十分界之間畫圓線九道界為十層自每十分之初至每十分之末各作對角斜線則每一圓線與斜線之交即逐度之一分也取時刻者每三十度為一時平分之得十五度為一小時每一小時分為四刻自外界抵內界各畫直線而於內界之外畫圓線一層是為時刻界次將每刻十五分三分之各為五分自外界抵時刻界各畫直線而於時刻界之外外界之內各畫圓線一層是為五分界次於內五分界之外外五分界之內又各畫圓線一層為一分界而將每五分又各五分之各為一分畫直線與其界內次於內外兩一分界之間畫圓線十一道界為十二層自每一分之初至每一分之末作對角斜線則每一圓線與斜線之交即逐分之五秒也每分為六十秒十二分之故為五秒兩徑合度界度既均儀體正矣而其用尤在於軸稍滯則運轉不靈稍滑則游移不定是必軸身與軸孔兩徑相同密相合切而後無滯滑之失其法以極精鋼製成軸本軸身近本徑八分近末微細以銅製為軸孔軸本軸孔皆扁方體詳前儀制本篇上下孔面各嵌鋼片厚五分開成圓孔較軸身微小乃以油濡軸身轉而入之鋼屑如泥隨轉而出軸外孔內更不容間則以軸身治軸孔即以軸孔治軸身故兩徑密相合切而自無滯滑之弊也合結均齊經緯各環製造既已如式而合結尤宜均齊其法先將子午圈之軸本過極圈四遊圈之軸孔三扁方治令方正十字分中凡圈皆正立軸本軸孔入於雙環之間軸本扁方先將東西二面及南北兩端各對軸徑取中線次將上面作十字線軸孔扁方先將上下二面各對軸孔作十字線次將東西二面南北兩端取中線自中線各取雙環中空之半為其扁方之厚子午圈中空一寸過極圈中空一寸二分四遊圈中空一寸四分入於雙環中空之間扁方微厚則不動次於軸本軸孔之中心結通徑線上下二軸各安銅管其端之中心開小圓孔以線結之上下二孔各安銅片其中心開小圓孔以線結之雙環之中空二極之兩面各結十字線雙環中空上下對扁方十字直線中間對銅枕厚分之半以線圍而結之二極上下對扁方十字橫線內面對極中徑以線圍而結之三線相參通徑直線一十字圍線二縱橫皆三倘一線有毫釐之差則非中心有偏即十字線不正中心有偏者治扁方十字不正者治直線務令三線相合始為得中即於上下二扁方及四銅枕刻線作記以為合結之用乃將軸本軸孔之扁方二極雙環之兩面皆自中線取分各作四孔以銅螺旋結之徑三分試定易鋼螺旋徑四分次將過極圈與遊旋赤道合結為三辰儀於過極雙環之南北兩半周去極九十度中線之上下各取六分與九十度作平行線自內規面向外各取一寸一分與南北極作平行線依線裁成缺口以受赤道之內入又於遊旋赤道之南北兩半周丑宮未宮之東或西取一寸四分與冬夏至作平行線作線於東則半弧背自西裁作線於西則半弧背自東裁法理皆同自外規面向內各取一寸一分與辰宮戌宮作平行線依線裁去半弧背凡裁弧皆梢留有餘比試合切使令方正以足過極圈之內容則遊旋赤道適容入於過極雙環之內而丑宮未宮線適當雙環中空之間遊旋赤道外徑五尺五寸六分南北各裁一寸一分餘五尺三寸四分過極圈內徑五尺一寸二分南北各開一寸一分亦得五尺三寸四分九十度中線之上下各去六分共去一寸二分與遊旋赤道之厚等丑宮未宮之東或西去一寸四分為雙環厚分之半故遊旋赤道適容入於過極雙環之內而丑宮未宮線正當雙環中空之間乃依裁去弧背之度除雙環分位另製弧背銅補全遊旋赤道以銅釘固之並補畫度分仍將補銅拆去合結兩環使丑宮未宮正與所記中線相對又依前法於軸孔結通徑線又自雙環上下扁方直線過丑宫未宫自扁方橫線過辰宫戌宫結十字線三線相參合為一線復用半徑之斜度作尺製斜尖二管貫於尺之兩端斜度之一尖直指於南北極之外界一尖直指於辰宫戌宫之外界以螺旋固之轉相比試四象限皆相符合乃將補銅釘而固之又以遊旋赤道結於過極圈之兩要恐東西兩半周日久傾墊故製二象限弧以承其下其方一寸其弧即用過極圈一象限弧之度一端減雙環厚分之半一寸四分抵於過極圈南極之外面一端減赤道厚分之半六分承於遊旋赤道辰宫戌宫之下面外加二足各長一寸二分與環面之濶等以螺旋結之復以前尺斜度之兩象限仍相符合南極有二弧不可量故惟量北極兩象限此兩象限合則彼兩象限亦必合矣則遊旋赤道與過極圈相交成直角均齊方正而無有偏側矣次於三辰儀之外將子午圈與天常赤道合結為六合儀其子午雙環之南北兩半周去極九十度中線之上下裁成缺口天常赤道之南北兩半周裁去半弧背並另製弧背銅補畫時刻皆與三辰儀同子午圈內規面裁去一寸二分九十度上下各裁七分乃能容天常赤道數雖小異而其理其法則同也乃立置天常赤道圈中線左右以木承之使其下可結十字線以裁去半弧背之半周仰於上納入三辰儀天常赤道順列之十二時與遊旋赤道之十二宫同在一面乃向北極之上面也將子午圈合結於其外以木橙承其四隅使二環之面相平二極之線參直周圍之分縫皆相等天常遊旋二赤道下半周之分縫以木片實之使周圍亦相等乃將軸本入於子午圈南北極中空之間貫於過極圈南北極之軸孔使扁方之四孔與環面之四孔相合以銅螺旋結之依前法於軸端結通徑線子午卯酉各結十字線三線相參合為一線又用斜尺潔度四象限皆相符合乃將補銅釘而固之則子午圈與天常赤道相交成直角均齊方正無有偏側又卯正酉正有二小軸承於龍柱之珠孔自不虞傾墊矣至於四遊圈與窺衡合結為四遊儀其法較易已詳儀制並見後篇三重同心前篇分言合結之法先正其樞心次正其經緯宜其無不正矣然三重合為一儀必三重同心施之測量乃得允協且以一重而言三線相參視之猶逺二線相切即有一線之差再以二重合之尤易參錯則先合定外二重比較確凖而後加入內一重其中正較為易得也蓋子午圈過極圈貫於一軸則子午圈之軸本即天常赤道之中心過極圈之軸孔即遊旋赤道之中心如兩心皆得其中則兩心合而為一遊旋赤道之宫度線必與天常赤道之時刻線相合如一心有偏則兩心岐而為二而宫度線與時刻線不合矣然有偏東西與偏南北之殊又有軸本偏與軸孔偏之異偏東西者軸本軸孔厚分之中線不正當中空之半或偏東或偏西故丑宫未宫線亦偏子正午正之或東或西也偏南北者軸本軸孔扁方之中線不正當環面之徑或偏北或偏南故辰宫戌宫線亦偏卯正酉正之或北或南也治之之法先正東西立置子午圈按方位安定北極在上南極在下午正在北子正在南卯正在西酉正在東假如先是立置天常赤道圈西面午正在北子正在南卯正在下酉正在上則子午圈西首為北極東首為南極乃以氊鋪地將天常赤道圈向南推轉至子午圈在下即將子午圈東首轉北西首轉南向北推轉使北極在上則按位安定矣設以丑宫對於午正而未宫即對於子正轉以未宫對於午正而丑宫亦對於子正則東西正一有不對則東西偏比試兩次而軸本軸孔之偏正乃得而見焉凡兩試俱偏東俱偏西而偏分相等者為軸孔正軸本偏軸孔正則丑宫未宮線正當軸孔中心軸本偏東則挈之而東軸本偏西則挈之而西故所偏同向而偏分相等也東為軸本偏東西為軸本偏西其偏為偏分之一半所謂偏分者乃丑宫對午正未宫偏子正東西斜線之偏軸本軸孔所偏者乃丑宫未宮與子正午正平行線之偏如丑宫對於午正未宫偏子正東二分若以丑宫未宫線與子正午正線平行則丑宫偏午正東一分未宫亦偏子正東一分故其偏為偏分之一半其度之一分為尺之八毫凡偏分皆以遊旋赤道之度分而言遊旋赤道外徑五尺五寸六分周一丈七尺四寸六分七釐有竒以周天三百六十度每度六十分除之得每分為八毫零八忽有竒偏東二分者為軸本偏東一分應向西移一分將上下軸本二扁方之東西記定凡記方向只記一字可定西面去八毫東面加八毫以薄銅葉釘之則軸本正而不偏矣偏西者凖此凡治軸本軸孔應移八毫者上下各移八毫合之用線比較如上正下偏則上之扁方不動下之扁方移一釐六毫如上亦微偏則上移四毫下移一釐二毫或上移六毫下移一釐總使上下共移一釐六毫而其十字中心正移八毫上偏下正及偏南偏北者皆倣此治之凡兩試一偏東一偏西而偏分相等者為軸本正軸孔偏軸本正則子正午正線正當軸本中心設軸孔偏於戌宫之一面丑宫在北戌宫在西是軸孔偏於丑宫未宫線之西挈之於軸本則丑宫未宫線必偏於子正午正線之東轉而丑宫在南戌宫在東是軸孔偏於丑宫未宫線之東挈之於軸本則丑宫未宫線必偏於子正午正線之西故所偏異向而偏分亦相等也東為軸孔偏西西為軸孔偏東其偏亦為偏分之一半偏東二分者為軸孔偏西一分應向東移一分將上下軸孔二扁方及環面之東西記定子午圈有定向故不須記過極圈有轉易故并記之東面去八毫西面加八毫則軸孔正而不偏矣偏西者凖此凡兩試俱偏東俱偏西而偏分不等者為軸本偏軸孔亦偏偏東分多為軸孔偏西偏西分多為軸孔偏東軸本偏東而軸孔又偏西挈之於軸本則丑宫未宫線必益在子正午正線之東故偏東分多也軸本偏西而軸孔又偏東挈之於軸本則丑宫未宫線必益在子平午正線之西故偏西分多也其軸孔之偏為偏多一半之半偏東多二分者為軸孔偏西半分偏西多二分者為軸孔偏東半分先治軸孔則偏分等平行線之偏既為偏分之一半而軸本軸孔在偏多之偏又為平行線所偏之一半故為一半之半如丑宫對於午正未宫偏子正東二分未宫對於午正丑宫偏子正東四分是未宫在北偏東多二分若以丑宫未宫線與子正午正線平行丑宫偏午正東一分則未宫亦偏子正東一分未宫偏午正東二分則丑宫亦偏子正東二分是未宫在北偏東僅多一分均分其半將軸孔向東移半分則未宫在北丑宫未宫線偏子正午正東一分半丑宫在北未宫在南丑宫未宫線亦偏子正午正東一分半試以丑宫對於午正則未宫偏子正東三分轉以未宮對於午正丑宫亦偏子正東三分其偏分等東為軸本偏東西為軸本偏西其偏為偏分之一半再治軸本則不偏矣凡兩試一偏東一偏西而偏分不等者為軸孔偏軸本亦偏偏東分多為軸本偏東偏西分多為軸本偏西其軸本之偏亦為偏多一半之半偏東多二分者為軸本偏東半分偏西多二分者為軸本偏西半分先治軸本則偏分等如丑宫對於午正未宫偏子正東二分未宫對於午正丑宫偏子正西四分是未宫在北偏西多二分若以丑宫未宫線與子正午正線平行丑宫偏午正東一分則未宫亦偏子正東一分未宫偏午正西二分則丑宫亦偏子正西二分是未宫在北偏西僅多一分均分其半將軸本向東移半分則未宫在北丑宫未宫線偏子正午正西一分半丑宫在北未宫在南丑宫未宫線偏子正午正東亦一分半試以丑宫對於午正則未宫偏子正東三分轉以未宫對於午正則丑宫偏子正西三分其偏分等東為軸孔偏西西為軸孔偏東其偏為偏分之一半再治軸孔則不偏矣凡兩試一正一偏者為軸本與軸孔之偏分相等一正一偏東者為軸本偏東軸孔偏西一正一偏西者為軸本偏西軸孔偏東其偏各為偏分一半之半軸本偏東則子正午正線在軸本之西若軸孔亦偏東其偏分等則丑宫未宫線必與子正午正線相合及其轉而之西則軸孔為偏西而丑宫未宫線在軸孔之東挈之於軸本蓋在子正午正線之東其偏必倍故半之為相等之偏又半之為平行線之偏軸本偏西者凖此先治軸孔則變為俱偏東俱偏西其偏分等再治軸本則不偏矣若先治軸本則變為一偏東一偏西其偏分亦等再治軸孔則亦不偏矣以上凡治軸本軸孔之偏東偏西先并環面之東西記定平置子午圈用木橙承穩解螺旋下之磨治合度復結螺旋立置比試皆合則東西正其南北亦正者則辰宫戌宫與卯正酉正合為一線其南北不正者辰宫戌宫線亦必與卯正酉正線平行乃察其南北依前法以丑宫對於午正未宫對於子正察辰宫戌宫線偏卯正酉正南北幾分轉以未宫對於午正丑宫對於子正察辰宫戌宫線偏卯正酉正南北幾分如此比試兩次則軸本軸孔之偏南偏北亦可得而見焉凡兩試俱偏南俱偏北而偏分相等者為軸本正軸孔偏南為軸本偏南北為軸夲偏北皆與前法同理但易東西為南北耳偏南一分者為軸本偏南一分辰宫戌宫線既與卯正酉正線平行故其偏分即為軸本之偏應向北移一分將上下軸本二扁方之南北記定環面四小孔向北開八毫軸夲扁方四小孔向南開八毫治令圓正易螺旋結之環面四小孔向北開八毫軸夲固可向北移矣然孔不圓正故將軸夲扁方四小孔向南開八毫治令圓正其徑較大故易微大之銅螺旋結之至比試確凖乃易用鋼螺旋也則軸夲正而不偏矣偏北者凖此凡兩試一偏南一偏北而偏分相等者為軸本正軸孔偏偏南一分者為軸孔偏北一分應向南移一分將上下軸孔二扁方及環面之南北記定環面四小孔向南開八毫軸孔扁方四小孔向北開八毫治令圓正易螺旋結之則軸孔正而不偏矣偏北者凖此凡兩試俱偏南俱偏北而偏分不等者為軸本偏軸孔亦偏偏南分多為軸孔偏北偏北分多為軸孔偏南其軸孔之偏為偏多之一半偏南多二分者為軸孔偏北一分偏北多二分者為軸孔偏南一分先治軸孔則偏分等辰宫戌宫線既與卯正酉正線平行則軸本軸孔在偏多之偏止為平行線所偏之一半如丑宫對於午正辰宫戌宫線偏卯正酉正南二分轉以未宫對於午正辰宫戌宫線偏卯正酉正南四分未宫在北偏南多二分是軸孔偏於未宫一分將軸孔向丑宫移一分則丑宫在北辰宫戌宫線偏卯正酉正南三分未宫在北辰宫戌宫線偏卯正酉正南亦三分其偏分等南為軸本偏南北為軸本偏北其偏即偏分再治軸本則不偏矣凡兩試一偏南一偏北而偏分不等者為軸孔偏軸本亦偏偏南分多為軸本偏南偏北分多為軸本偏北其軸本之偏亦為偏多之一半偏南多二分者為軸本偏南一分偏北多二分者為軸本偏北一分先治軸本則偏分等南為軸孔偏北北為軸孔偏南其偏即偏分再治軸孔則不偏矣凡兩試一正一偏者為軸本與軸孔之偏分相等一正一偏南者為軸本偏南軸孔偏北一正一偏北者為軸本偏北軸孔偏南其偏各為偏分之一半先治軸孔則變為俱偏北俱偏南其偏分等再治軸本則不偏矣若先治軸本則變為一偏北一偏南其偏分亦等再治軸孔則亦不偏矣以上凡治軸本軸孔之偏北偏南若與偏東偏西一同比試然後解螺旋下之按分磨治未嘗不可但所偏之向或有互異易致混淆且未正東西必以丑宫未宫線與子正午正線平行方可察其偏南北而察平行線之偏兩端察視較偏子正一端之察視為難故以先正東西而後正南北之為便也六合三辰二重東西南北既正乃平置子午圈解螺旋下之加入四遊儀貫於軸本結螺旋立置如前比試則止有軸孔之偏而無軸本之偏以四遊圈南北極之中線與軸本參直則軸孔之南北正線偏南將軸孔向南移線偏北將軸孔向北移以窺衡之中線與丑宫未宫子正午正線展轉相對則軸孔之東西正線偏東將軸孔窺衡向東移線偏西將軸孔窺衡向西移窺管中線原應與軸孔參直但毫釐之差甚為難辨且窺衡之在直距亦應東西適中如窺衡既已適中則移軸孔如有微偏則移窺衡窺衡東西二面各有眼錢如移向東則將東面眼錢易薄西面眼錢易厚如移向西則西面易薄東面易厚總期窺衡中線與子正午正丑宫未宫線相合如此則三重合為一心東西南北皆合為一線用以測量而經緯乃無不協也安置方正前言製造之法亦略備矣然安置不正則亦不可用其法先於臺面儀基之正中取南北真線南北真線隨地不同京師偏指南針西二度三十分南北中三處各作垂線與之參直依此儀基作南北線又作十字東西線將儀座縱橫對凖安定自三垂線視之與座面中線參直用三角中垂線表木板為之制如並矩底長六尺中長三尺兩弦各長四尺二寸四分平分底線為底之中自底線之兩端取弦分相交於上尖為角之中自角中至底中作垂線為中垂線中垂線直則底平仰置座面以取平中心安雲座兩端安龍柱懸垂線以取直座面有兩槽以受子午雙環柱端龍口銜珠半珠開孔以受天常赤道兩傍之小軸自珠孔中心至座面槽底與子午雙環半徑等兩珠孔相距與天常赤道全徑等用三角中垂線表覆於珠孔表底兩端留小圓軸扣於珠孔自底中掛垂線表之垂線適當於雲座面之正中則雲座正而珠孔平兩珠孔之距儀心各為天常赤道全徑之一半自三垂線視之與兩槽中線參直則雲座與龍柱皆正矣乃懸全儀安置其上以北極上五十度五分為天頂南極下五十度五分為天頂之衝於子午圈之東面作上下直線對於雲座南北正中之線口雲座東面南北正中有線口其下有雲窩以受垂球自天頂施小釘掛垂線適合上下直線而垂球入於雲窩又適切環面不即不離自三垂線視之適當子午雙環中空之半則南北東西皆正候日月星至子午線用窺衡察視經緯悉協夫然後上下四方均齊方正惟用所適無不宜矣欽定儀象考成卷首上
