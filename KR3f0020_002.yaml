甲乙丙為子午圈丁為地心戊為地面已庚為地平已乙與庚丙為太陽在地平上最大之地半徑差十秒與丁戊地半徑等巳乙與庚丙弧線甚小可作直線算故謂與丁戊地半徑等戊辛為地周蒙氣之厚六千零九十五丁戊地半徑設為一千萬戊辛為六千零九十五壬為太陽視髙點壬戊巳角為午正太陽視髙度四十度癸為太陽實髙點癸丁乙角為午正太陽實髙度戊子壬為視線常直而髙戊子癸為光線常折而下壬子癸角為本時蒙氣差角戊癸為太陽距地面丁癸為太陽距地心戊癸丁角為本時地半徑差角先求蒙氣差自地心丁過子點作丁丑蒙氣之割線則壬子丑角為視線與割線所成之角癸子丑角為光線與割線所成之角其兩角之較即壬子癸蒙氣差之角也先用丁戊子直線三角形有丁戊子角之外角即太陽視距天頂度有丁戊邊即地半徑一千萬有丁子邊地半徑加蒙氣之厚求丁子戊角以丁子一千萬零六千零九十五為一率丁戊一千萬為二率丁戊子角之外角五十度之正弦七百六十六萬零四百四十四為三率求得四率七百六十五萬五千七百七十八為丁子戊角之正弦檢表得四十九度五十七分三十秒為丁子戊角度與壬子丑角等即視線與割線所成之角乃以視線角之正弦定率一千萬為一率光線角之正弦定率一千萬零二千八百四十一為二率前所得之壬子丑角即丁子戊角正弦七百六十五萬五千七百七十八為三率求得四率七百六十五萬七千九百五十三為癸子丑角之正弦檢表得四十九度五十八分四十秒為癸子丑角度即光線與割線所成之角與壬子丑角度相減餘一分十秒為壬子癸角度即蒙氣差角之度也壬子癸角乃子點之角人自地面戊點視之則壬戊癸角始為蒙氣差角然所差甚微故即以壬子癸角為壬戊癸角也與壬戊已角視髙度相減餘三十九度五十八分五十秒為癸戊已角即無蒙氣差之視髙度次求地半徑差將戊癸線引長至子作丁子垂線即癸角地半徑差之度用丁戊子直角三角形有丁戊邊有子直角有戊角求丁子邊以半徑一千萬為一率戊角五十度一分十秒之正弦七百六十六萬二千六百二十六為二率丁戊十秒為三率求得四率八秒為丁子即癸角地半徑差之度與癸戊已角三十九度五十八分五十秒相加得三十九度五十八分五十八秒為癸丁乙角度即午正太陽實髙度也欽定儀象考成卷首下欽定四庫全書欽定儀象考成卷二恆星黃道經緯度表一黃道星紀宫赤道度附恆星黃赤經緯度表恆星布列周天古有去極入宿度數入宿即經度也去極即緯度也然黃道度與赤道度不同嵗差亦異蓋黃道以黃極為樞赤道以赤極為樞兩道兩極各相距二十三度半故星在兩極之間者黃道屬未宫赤道則屬丑宫星在兩道之間者黃道屬緯南赤道則屬緯北此黃赤不同之極致也恆星循黃道東行每年五十一秒緯度終古不改而經度之差有常赤道與黃道斜交分至前後南北逺近其差不等兩極之間在黃道為差而東在赤道為差而西兩交之際黃道南者差而入赤道北黃道北者差而出赤道南此嵗差不同之極致也今以乾隆九年甲子恆星黃赤經緯度依黃道次序列恆星黃道經緯度表而以赤道經緯附之依赤道次序列恆星赤道經緯度表而以黃道經緯附之各將赤道嵗差列於其下黃道以便推算赤道以便測量厯象之用於斯備矣欽定儀象考成卷二
