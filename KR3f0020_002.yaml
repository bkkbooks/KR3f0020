  text: 欽定四庫全書欽定儀象考成卷首下御製璣衡撫辰儀説卷下
  hash: sha256:54442a31e090cdb4f4ee21e8847818e5429689522a27de33c2f4f092335bcb26
  markers:
  - {type: page-break, offset: 0, content: '', id: KR3f0020_WYG_002-1a, image: WYG0793/WYG0793-0052c.png}
body:
  text: 用法算法御製璣衡撫辰儀説卷下之一用法測太陽時刻測日出入時刻及晝夜永短測太陽赤道緯度測午正太陽髙弧測太陽赤道經度測月星赤道經緯度測恆星求時刻測月五星求時刻測月星當中及偏度測月星出入地平時刻測南北真線測北極髙度測黃赤距度測黃白距度測太陽時刻法以四遊圈東西推轉窺衡南北低昂令太陽從衡孔透光圓正或用薰黑玻璃置於下端衡孔視上端圓孔十字線正當太陽中心則窺衡與太陽參直乃視四遊圈下周指時度表臨於天常赤道之某時刻分即太陽時刻也若二分前後日影為赤道所礙則用窺衡上面立表測之常時不為赤道所礙亦用此表為便若午正及卯酉前後日影為子午圈及龍柱所礙則用窺衡上面平行立表測之以四遊窺衡對凖太陽令上端表圓孔十字線影從下端表圓孔正中透出上端表直線影從下端表直縫正中透出測時刻止用經度可止取直線影若測緯度則必取圓孔十字線影視指時度表所指即得太陽時刻若指時度表為子午圈所礙則易用借弧指時度表次用平行立表測定日影視借弧指時度表所指時刻加一小時即得太陽時刻蓋借弧之長當遊旋赤道之十五度當天常赤道之一小時又借表在四遊圈之西所指時刻在本時前故加一小時即為本時刻分也測日出入時刻及晝夜永短法於太陽出入地平時按前法測得太陽出入時刻乃計距午正前後若干刻分倍之即得晝刻計距子正前後若干刻分倍之即得夜刻測太陽赤道緯度法如前測凖太陽視窺衡下端指緯度表所指四遊圈右面距赤道度分即得太陽赤道緯度表指赤道北太陽緯度為在赤道南表指赤道南太陽緯度為在赤道北蓋窺管以圓心為樞上端所窺在赤道北下端所指必在赤道南上端所窺在赤道南下端所指必在赤道北也測午正太陽髙弧法於午正時測得太陽赤道緯度在赤道北與赤道髙五十度五分相加在赤道南與赤道髙五十度五分相減即午正太陽髙弧也測太陽赤道經度法用恆星作距測之取所知近午正前後一恆星午正前後取其蒙氣少易得確凖也以其赤道經度之對衝用綰經度表於遊旋赤道綰定四遊圈凡以儀器測星其上當星處為星之正位其下當人目處則星之對沖故以星經度之對沖於遊旋赤道綰定四遊圈又任設一時用綰時度表於其時刻之對衝綰定天常赤道天常環面乃日影所照之時其對沖則太陽所臨之正位故於設時之對沖綰之如設丑正初刻則綰於未正初刻即太陽臨於丑正之位也乃將四逰圈帶定遊旋赤道用窺衡測凖距星隨之左旋候至所設時刻或鐘表或漏壺須得確凖視綰時度表對於遊旋赤道之某宫度分即太陽赤道經度也環面時刻之對沖即太陽所臨之正位故其所對遊旋赤道之宫度即太陽經度又法先以恆星作距測金星次以金星作距測太陽如金星晨見則於太陽未出之前取在金星西之一恆星作距以其赤道經度用平行線測經度表於遊旋赤道安定三測皆係經度若距星之經度用對沖則測得之經度又須加減半周故距星不用對沖所測亦即得本度也令一人用此平行線表窺定距星隨之左旋一人用四遊窺衡測金星兩人同時測定乃視四遊圈指時度表所指遊旋赤道之宫度分即金星赤道經度次以金星赤道經度用平行線測經度表於遊旋赤道安定令一人窺定金星隨之左旋一人於太陽始出時用四遊窺衡測太陽乃視四遊圈指時度表所指遊旋赤道之宫度分即得太陽赤道經度若金星夕見則於太陽將入時任於某宫初度安定平行線測經度表令一人窺定金星又令一人用四遊窺衡測太陽視太陽距金星若干度記定俟太陽既入後取金星東之一恆星作距按前法測得金星赤道經度內減太陽距金星之度星在東日在西故減即得太陽赤道經度也太陽光大惟月及金星可以兩見然月有視差不如用金星為凖也測月星赤道經緯度法於昏後曉前任設一時以本日太陽赤道經度與次日太陽赤道經度比例得本時太陽赤道經度七政時憲書所列乃子正之度子正後七政皆有行分故以本日子正之度分與次日子正之度分相減餘為一日十二時所行之分與設時距子正之時分為比例得設時距子正之行分加於本日子正之度分得本時之度分用綰時度表於遊旋赤道綰定又以所設時刻之對沖於天常赤道綰定候至所設時刻用四遊窺衡測月星乃視指時度表所指遊旋赤道宫度加半周環面時刻之對沖即為太陽之正位環面之宮度却為月星之對沖故加半周即得所測月星赤道經度隨察指緯度表所指四遊圈距赤道南北度分即得所測月星赤道緯度也緯之南北與前測太陽緯度法同又法用恆星作距測之以距星之赤道經度用平行線測經度表於遊旋赤道安定令一人用此平行線表窺定距星隨之左旋一人用四遊窺衡測月星兩人同時測定乃視指時度表所指遊旋赤道之度分即所測月星之赤道經度隨察指緯度表所指四遊圈之度分即得所測月星之赤道緯度也測恆星求時刻法先以恆星赤道經度用綰經度表於遊旋赤道綰定四遊圈次約計測時為某時依前法比例得本時太陽赤道經度太陽每日行一度於時為四分每一時行五分於時為二十秒故約計測量之時比例得其時赤道經度即可用以測時刻也用綰時度表綰定遊旋赤道將四遊圈帶遊旋赤道推轉用窺衡測定恆星乃視綰時度表對於天常赤道之某時刻分加六時即太陽時刻也天常赤道之時刻乃日影對照之時故加六時始為太陽所臨之時刻也測月五星求時刻法以本時太陽赤道經度用綰時度表綰定遊旋赤道以月五星本時赤道經度之對沖用綰經度表於遊旋赤道綰定四遊圈將四遊圈帶遊旋赤道推轉用窺衡測定月星乃視綰時度表對於天常赤道之某時刻分加六時即得太陽時刻若太陽近子正前後綰時度表為子午圈所礙則向東或西借三十度綰定測之視所對時刻加減一時向東借則加向西借則減即得太陽時刻若月五星近赤道或近午正前後為諸圈所礙則用窺管上面立表及平行立表測之與前測太陽時刻法同測月星當中及偏度法以四遊窺衡隨時測月或星視指時度表當天常赤道之某時刻分記之近午正則易用借弧指時度表加一小時午正為當中無偏度午正前為偏東午正後為偏西乃以距午時分變赤道度每一時為三十度每一小時為十五度每一分為十五分每一秒為十五秒共之為所偏度凡推月星當中及偏度者用此法測之則離合可辨凡有求時刻者用此法測定則時刻可推也測月星出入地平時刻法以本日子正月五星赤道經度或恆星經度之對沖用綰經度表於遊旋赤道綰定四遊圈又以本日子正太陽經度用綰時度表綰定遊旋赤道爰以四遊窺衡於月星出入地平時測之視綰時度表當天常赤道之某時刻分加六時為本日月星出入時刻之通數復計測時距本日子正後若干時刻比例得太陽行分變時每一度為四分每十五分為一分每十五秒為一秒為太陽時差比例得月五星行分變時為月五星時差恆星則無行分亦無時差乃於前所測月星出入時刻之通數減太陽時差加月五星時差即得月星出入地平時刻蓋日與月星測時皆用子正經度而子正後太陽有右旋之行分則時刻必差而早月五星亦有右旋之行分則時刻必差而遲時刻左旋七政皆右旋太陽有右旋之行分則測時太陽之經度必在所測時刻之前故差而早月五星有右旋之行分則測時月星之方位必在所測時刻之後故差而遲故減太陽時差加月五星時差若五星逆行則時差亦減方為月星出入地平真時此與前測月星求時刻法同理設時可以預知故先求本時經度而後測月星出入難以懸定故先測而後加減時差其理相通其用尤便也測南北真線法於太陽出地平時測其距午東赤道度又於太陽入地平時測其距午西赤道度測得太陽出入地平距午正前後若干時分變赤道度即得距午正東西赤道度兩距午度相等則子午圈之向即南北真線若日出距午東之度多日入距午西之度少則子午圈之午正偏西若日出距午東之度少日入距午西之度多則子午圈之午正偏東此言午正乃子午圈之正南以兩測之距午度相減折半即所偏之赤道經度若求地平偏度則用三角法推之見算法第八則依所偏之度作線即南北真線也又法於冬至後測織女第一星昏刻此星當酉正之位以四遊圈安於酉正測其去極度若干九十度內減赤道緯度餘即去極度旦刻此星當卯正之位以四遊圈安於卯正測其去極度若干織女星在赤道丑宫七度赤道北三十八度半冬至後半月內昏旦可以兩見故専取此星測之兩去極度相等則子午圈之向即南北真線若卯正位測得去極度多酉正位測得去極度少則東逺西近即子午圈之北極偏西若卯正位測得去極度少酉正位測得去極度多則東近西逺即子午圈之北極偏東以兩測之去極度相減折半即所偏之赤道緯度若求地平偏度則用三角法推之見算法第十五則依所偏之度作線即南北真線也蓋南北真線自北極過天頂平分赤道之地平上半周是為午正故向南測者以午正為凖向北測者以北極為凖太陽隨天左旋其出地入地距午必相等若其不等必儀之午正偏也恆星繞地左旋其在東在西去極必相等若其不等必儀之北極偏也依其偏度正之則南北真線得矣又按渾儀經緯與天同象測太陽亦可用緯度測恆星亦可用經度然不及右二法之簡明推測精熟法理自見今不具悉也測北極髙度法於冬至前後以四遊圈安於正北測天權星即北斗第四星昏刻此星在北極之下測其去極度若干旦刻此星在北極之上測其去極度若干天權星今在赤道辰宫初度赤道北五十八度冬至前後半月內昏旦可以兩見故専取此星測之兩去極度相等則儀之北極髙度與天合若在上之去極度少在下之去極度多則儀之北極差髙若在上之去極度多在下之去極度少則儀之北極差下以兩測之去極度相減折半即所差之地平緯度於儀之北極髙度加減之差髙則減差下則加即天之北極髙度也蓋天之北極無星故取大星之環繞北極上下者測之星之去極有定度則上下兩測之去極必等若其不等則儀之髙下差也依其差度加減之則在天之北極髙度得矣又按舊法用地平緯儀測鉤陳大星以其在北極上下兩髙度相加折半得北極髙度取其距地髙無蒙氣也今用渾儀測之則鉤陳大星為儀樞所礙須用借弧故取用天權星測其去極之較以備一例若以所測在北極上之去極度與所設北極髙度相加以所測在北極下之去極度與所設北極髙度相減得兩地平髙度相加折半得北極髙度與用鉤陳大星之理同測黃赤大距法於冬至日午正初刻測太陽在赤道南若干度分夏至日午正初刻測太陽在赤道北若干度分若冬至夏至皆在午正初刻則所測日距赤道南北之緯度即黃赤大距度若冬至夏至不正當午正則又用前測太陽赤道經度法測得太陽距冬夏至前後若干度分用有太陽赤道經緯度求黃赤交角之法見算法第四則求得黃赤交角即黃赤大距度也蓋黃道與赤道斜交春秋分時太陽正當赤道春分後秋分前太陽在赤道北夏至而極北秋分後春分前太陽在赤道南冬至而極南故致日者必於冬夏二至今用弧線三角形法測得逐日之距緯皆可以推大距然春秋分前後黃道斜而緯差大以推大距其理隱而難知冬夏至前後黃道橫而緯差微以推大距其象顯而易見故冬