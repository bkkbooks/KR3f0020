body:
  text: 月五星相距恆星經緯度表黃道十二宫赤道度附月五星相距恆星經緯度表恆星在天各有定位月五星東行過之南北相距一度以內為犯月距十七分以內五星距三分以內為凌同度為掩月五星出入黃道不過十度故取黃道南北十度以內之恆星依黃道次序列為表而以赤道經緯附之并將赤道歲差列於其下推算之法詳見考成上編兹不具載欽定儀象考成卷二十六
