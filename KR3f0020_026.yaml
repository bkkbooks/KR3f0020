body:
  text: 月五星相距恒星經緯度表黄道十二宫赤道度附月五星相距恒星經緯度表恒星在天各有定位月五星東行過之南北相距一度以内為犯月距十七分以内五星距三分以内為凌同度為掩月五星出入黄道不過十度故取黄道南北十度以内之恒星依黄道次序列為表而以赤道經緯附之并將赤道歲差列於其下推算之法詳見考成上編兹不具載欽定儀象考成卷二十六
