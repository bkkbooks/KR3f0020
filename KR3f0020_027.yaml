body:
  text: 天漢經緯度表一黄道北天漢度天漢黄赤經緯度表晉書天文志云天漢起東方經箕尾之間謂之漢津乃分為二道其南經傳説魚天籥天弁河鼓其北經龜貫箕下次絡南斗魁左旗至天津下而合南道乃西南行又分夾瓠𤓰絡人星杵造父螣蛇王良附路閣道北端大陵天船卷舌而南行絡五車經北河之南入東井水位而東南行絡南河闕邱天狗天記天稷至七星南而没明史天文志云近年浮海之人至赤道以南見雲漢過天狗之墟抵天社海石之南踰南船帶海山貫十字架蜜蜂傍馬腹經南門絡三角龜杵而屬扵尾宿是為帶天一周靈䑓儀象志天漢經緯度分列黄道南北赤道南北四表與明史合但不按宮次或分二界或分三界或分四界逐度列表其分合曲折之處尚有未詳今亦分黄赤南北四表而各按宮次分南界北界南之北界北之南界各列四層其分合既為明晰至其曲折之處經緯或有不同又扵每度之間細分列表按數圖之庶合懸象云欽定儀象考成卷二十七
  hash: sha256:471c8f0d5d14e9fa80cb7caf0d369f2db8652c1863303eda8a9a46c5a4f7913e
